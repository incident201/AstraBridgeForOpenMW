[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "astrabridge-runner"
version = "0.1.1"
description = "Thin native-tool runner for AstraBridge with ChatGPT OAuth and DeepSeek"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["httpx==0.28.1", "jsonschema==4.26.0", "PyJWT[crypto]==2.10.1"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
astrabridge-runner = "astrabridge_runner.main:main"

[tool.setuptools.packages.find]
where = ["src"]
