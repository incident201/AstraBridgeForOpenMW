name: Build container and Desktop release
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      prerelease:
        type: boolean
        default: true
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v0.3.0-rc1)
        required: true
        type: string
      prerelease:
        description: Mark as a pre-release
        type: boolean
        default: true
      publish:
        description: Publish after checks (requires a public GHCR package)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: astrabridge-container-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare release locally
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = branch
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo 'Release tag already exists' >&2
            exit 1
          fi
          python3 packaging/prepare_release.py "$RELEASE_VERSION"
          python3 - <<'PYCODE'
          import os
          if ('-' in os.environ['RELEASE_VERSION']) != (os.environ['PRERELEASE']=='true'):
              raise SystemExit('Prerelease flag must match the version suffix')
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION.json desktop/package.json desktop/package-lock.json
          git diff --cached --quiet || git commit -m "Release $RELEASE_VERSION"
          git tag -a "$RELEASE_VERSION" -m "AstraBridge $RELEASE_VERSION"
          git bundle create release.bundle "refs/tags/$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: release.bundle
          retention-days: 7
  runtime:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/incident201/astrabridge-runtime:${{ inputs.version }}
      RELEASE_VERSION: ${{ inputs.version }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/source
      - run: |
          git fetch "$RUNNER_TEMP/source/release.bundle" "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
          git checkout --detach "$RELEASE_VERSION"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select runner workspace
        run: echo "WORK=$RUNNER_TEMP/astra-work" >> "$GITHUB_ENV"
      - name: Free space for native builds
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h "$RUNNER_TEMP"
      - name: Host tools and source tests
        run: |
          sudo apt-get update
          sudo apt-get install -y podman crun uidmap passt fuse-overlayfs lua5.4 g++
          python -m pip install -r runtime/requirements-dev.txt
          PYTHONPATH=runtime/daemon python -m pytest -q runtime/tests packaging/tests
          python packaging/check_source_only.py
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            ${{ env.WORK }}/build
            ${{ env.WORK }}/downloads
            ${{ env.WORK }}/cache/ccache
            ${{ env.WORK }}/cache/pip
            ${{ env.WORK }}/builder-image.tar
          key: oci-native-v2-${{ hashFiles('runtime/container/**', 'packaging/build_ffmpeg.py') }}-${{ hashFiles('openmw-source/**', 'runtime/native/**') }}
          restore-keys: |
            oci-native-v2-${{ hashFiles('runtime/container/**', 'packaging/build_ffmpeg.py') }}-
            oci-native-v2-
      - name: Authenticate frozen dependency base
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build engine, FFmpeg and runtime image
        run: python packaging/build_runtime.py --work "$WORK" --image "$IMAGE" --jobs 3 --cache-builder --base-registry ghcr.io/incident201/astrabridge-runtime
      - name: CPU recording through the production runtime
        run: |
          podman --root "$WORK/containers" --runroot "$WORK/run/podman" run --rm --network=none \
            -v "$GITHUB_WORKSPACE/packaging:/checks:ro" -v "$WORK/tests:/results" \
            --entrypoint /opt/astrabridge/python/bin/python "$IMAGE" \
            /checks/cpu_recording_smoke.py --directory /results/cpu-recording
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ${{ env.WORK }}/build
            ${{ env.WORK }}/downloads
            ${{ env.WORK }}/cache/ccache
            ${{ env.WORK }}/cache/pip
            ${{ env.WORK }}/builder-image.tar
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Publish tested OCI image and record registry digest
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          podman --root "$WORK/containers" --runroot "$WORK/run/podman" push \
            --digestfile "$WORK/dist/registry.digest" "$IMAGE" "docker://$IMAGE"
          python - <<'PY'
          import json, os
          from pathlib import Path
          work=Path(os.environ['WORK'])
          path=work/'dist/release.json';value=json.loads(path.read_text())
          value['digest']=(work/'dist/registry.digest').read_text().strip()
          assert value['git_tag']==os.environ['RELEASE_VERSION'] and not value['development']
          path.write_text(json.dumps(value,indent=2)+'\n')
          PY
          git archive --format=tar.gz --prefix=AstraBridge/ -o "$WORK/dist/astrabridge-$RELEASE_VERSION-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-release
          path: |
            ${{ env.WORK }}/dist/release.json
            ${{ env.WORK }}/dist/*-source.tar.gz
  desktop:
    needs: runtime
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: release-source
      - name: Use exact release sources
        shell: bash
        run: |
          git fetch release-source/release.bundle "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
          git checkout --detach "$RELEASE_VERSION"
      - uses: actions/download-artifact@v4
        with:
          name: runtime-release
          path: runtime-release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies and embed runtime identity
        shell: bash
        run: |
          mkdir -p desktop/resources
          cp runtime-release/release.json desktop/resources/release.json
          python -m pip install -r runtime/requirements.txt
          cd desktop
          npm ci
          npm run build
          npm run check
          npm test
      - name: Package Linux
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          npm run package:linux
          if ! env -u DISPLAY -u WAYLAND_DISPLAY APPIMAGE_EXTRACT_AND_RUN=1 ./release/*.AppImage version > packaged-version.json; then
            cat packaged-version.json
            exit 1
          fi
          python -c 'import json; a=json.load(open("packaged-version.json")); b=json.load(open("resources/release.json")); assert a["ok"] and a["result"]==b'
          if ! env -u DISPLAY -u WAYLAND_DISPLAY APPIMAGE_EXTRACT_AND_RUN=1 ./release/*.AppImage --no-sandbox version > packaged-version-nosandbox.json; then
            cat packaged-version-nosandbox.json
            exit 1
          fi
          cmp packaged-version.json packaged-version-nosandbox.json
          APPIMAGE_EXTRACT_AND_RUN=1 node tests/packaged-cli.mjs ./release/*.AppImage
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Package Windows
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /MT packaging\launcher.cpp /Fe:packaging\astrabridge.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /MT packaging\cli-launcher.cpp /Fe:resources\cli-launcher.exe /link advapi32.lib user32.lib bcrypt.lib
          if errorlevel 1 exit /b 1
          npm run package:windows
          if errorlevel 1 exit /b 1
          release\win-unpacked\astrabridge.exe version
      - name: Check Windows portable archive
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem release -Filter 'AstraBridge-*-windows-x86_64.zip')
          if ($archives.Count -ne 1) { throw 'Expected one Windows portable archive' }
          $archive = $archives[0]
          $destination = Join-Path $env:RUNNER_TEMP 'AstraBridge portable check'
          Expand-Archive $archive.FullName $destination
          $actual = & (Join-Path $destination 'astrabridge.exe') version | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $actual.ok) { throw 'Packaged CLI failed' }
          $expected = Get-Content resources/release.json -Raw | ConvertFrom-Json
          if ($actual.result.digest -ne $expected.digest) { throw 'Packaged runtime identity differs' }
          $cliDirectory = Join-Path $env:RUNNER_TEMP 'AstraBridge CLI проверка'
          New-Item -ItemType Directory -Force $cliDirectory | Out-Null
          $cli = Join-Path $cliDirectory 'astrabridge.exe'
          Copy-Item (Join-Path $destination 'resources/astra/cli-launcher.exe') $cli
          $application = Join-Path $destination 'astrabridge.exe'
          $config = Join-Path $cliDirectory 'configuration.json'
          $target = "[AstraBridgeCLI]`r`nSchema=1`r`nExecutable=`"$application`"`r`nConfig=`"$config`"`r`n"
          [IO.File]::WriteAllText((Join-Path $cliDirectory 'cli-target.ini'), $target, [Text.Encoding]::Unicode)
          $forwarded = & $cli version | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $forwarded.result.digest -ne $expected.digest) { throw 'Permanent CLI forwarding failed' }
          $pathState = & $cli --user-path query $cliDirectory | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $pathState.changed) { throw 'Read-only PATH query failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*-windows-x86_64.zip
          if-no-files-found: error
  draft:
    needs: [runtime, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/source
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: runtime-release
          path: dist
      - name: Publish the release tag and draft assets
        run: |
          set -euo pipefail
          git fetch "$RUNNER_TEMP/source/release.bundle" "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
          git checkout --detach "$RELEASE_VERSION"
          (cd dist && sha256sum *.AppImage *-windows-x86_64.zip *-source.tar.gz release.json > SHA256SUMS)
          git push origin "refs/tags/$RELEASE_VERSION"
          notes="packaging/notes/$RELEASE_VERSION.md"
          if [ ! -f "$notes" ]; then notes=packaging/notes/default.md; fi
          gh release create "$RELEASE_VERSION" dist/* --verify-tag --draft \
            --prerelease="$PRERELEASE" --latest=false \
            --title "AstraBridge $RELEASE_VERSION" --notes-file "$notes"
      - name: Check anonymous runtime access and publish
        if: inputs.publish
        run: |
          set -euo pipefail
          python3 packaging/check_registry.py dist/release.json
          latest=false
          if [ "$PRERELEASE" = false ]; then latest=true; fi
          gh release edit "$RELEASE_VERSION" --draft=false --prerelease="$PRERELEASE" --latest="$latest"
