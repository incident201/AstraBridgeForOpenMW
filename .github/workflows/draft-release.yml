# Keep this registered workflow path usable from a development branch.
# The same path on main still belongs to the legacy release line.
name: Container release (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v0.3.0-rc1)
        required: true
        type: string
      prerelease:
        description: Mark as a pre-release
        type: boolean
        default: true
      publish:
        description: Publish after checks (requires a public GHCR package)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/container-release.yml
    with:
      version: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}
      publish: ${{ inputs.publish }}
