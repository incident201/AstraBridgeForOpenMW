name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y lua5.4 zstd
      - run: python -m pip install pytest mss imageio-ffmpeg Pillow
      - run: python -m pytest -q tests ../packaging/tests
        working-directory: harness
      - run: python packaging/check_source_only.py
