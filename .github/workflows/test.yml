name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: runtime/daemon
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y lua5.4 g++
      - run: python -m pip install -r runtime/requirements-dev.txt
      - run: python -m pip install -e './agent-runner[test]'
      - run: python -m ruff check runtime/daemon packaging agent-runner/src
      - run: python -m pytest -q runtime/tests packaging/tests agent-runner/tests
      - run: python packaging/check_source_only.py
      - name: Desktop checks
        working-directory: desktop
        run: |
          npm ci
          npm run build
          npm run check
          npm test
